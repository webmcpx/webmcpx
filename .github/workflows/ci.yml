name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same recipes as `just check` locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-shear,wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: sudo apt-get install -y binaryen
      - run: cd packages/webmcpx && npm ci
      - run: cd site && npm ci && npx playwright install --with-deps chromium firefox webkit
      - run: just check
        env:
          # The scanner's Chrome tests (SSRF, floods, timeouts) must run here, not skip.
          WEBMCPX_REQUIRE_CHROME: "1"
      - name: Generated files are up to date
        run: just gen && git diff --exit-code

  test-os:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS is advisory: `just check` already runs on macOS before every push, and since 2026-11-09
    # GitHub stopped acquiring hosted macOS runners for this repo (macos-latest and macos-15 alike).
    # A macOS failure still shows on the job; it no longer fails the run.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just,cargo-nextest
      - run: just test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `npx webmcpx lint` on each OS (path mapping differs on Windows); unoptimized, no binaryen here.
      - name: npx webmcpx lint (WASI)
        shell: bash
        run: |
          cargo build --target wasm32-wasip1 --profile release-wasm -p webmcpx
          mkdir -p packages/webmcpx/wasm
          cp target/wasm32-wasip1/release-wasm/webmcpx.wasm packages/webmcpx/wasm/webmcpx_cli.wasm
          cd packages/webmcpx && npm ci && node --test test/lint.test.js

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets
