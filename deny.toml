[advisories]
version = 2

[licenses]
version = 2
# Permissive only. ISC, BSD-3-Clause and CDLA-Permissive-2.0 come from the TLS stack (rustls,
# aws-lc, webpki roots) used by the benchmark's HTTP client; none reach the published crates.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
