<!doctype html>
<html lang="%lang%">
	<head>
		<!--email_off-->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f2f1ec" />
		<script>
			// Before first paint: mark JS as available, which enables the reveal animations (see base.css).
			document.documentElement.dataset.js = '';
		</script>
		%sveltekit.head%
		<!--/email_off-->
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- email_off: Cloudflare must not rewrite `webmcpx@0.1` (the install line) as an e-mail address. -->
		<!--email_off-->
		<div style="display: contents">%sveltekit.body%</div>
		<!--/email_off-->
	</body>
</html>
