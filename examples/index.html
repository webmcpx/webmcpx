<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webmcpx demo</title>
  <meta name="description" content="A page with webmcpx standard tools.">
  <script>
    // Simulated host for browsers without WebMCP: records tools on window.__tools.
    if (!document.modelContext && !navigator.modelContext) {
      window.__tools = {};
      document.modelContext = { registerTool: async (t) => { window.__tools[t.name] = t; } };
    }
  </script>
  <script type="module" src="../packages/webmcpx/dist/auto.js"></script>
</head>
<body>
  <main>
    <h1 id="top">Pizza Roma</h1>
    <p>Neapolitan pizza baked in a wood oven since 1998.</p>
    <h2 id="delivery">Delivery</h2>
    <p>Delivery takes 30 minutes and is free above 20 euros.</p>
  </main>
</body>
</html>
