[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/webmcpx/webmcpx"
homepage = "https://webmcp.zone"

[workspace.dependencies]
webmcpx-core = { path = "crates/webmcpx-core", version = "0.1.0" }
webmcpx-std = { path = "crates/webmcpx-std", version = "0.1.0" }
webmcpx-lint = { path = "crates/webmcpx-lint", version = "0.1.0" }

clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
insta = { version = "1.49.0", features = ["json"] }
insta-cmd = "0.7.0"
dlmalloc = { version = "0.2.14", features = ["global"] }
libm = "0.2.16"
# oxc ships breaking 0.x releases often: pin exactly.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
serde_json = "1.0.154"
thiserror = { version = "2.0.21", default-features = false }
# Must match the wasm-bindgen CLI version exactly (see justfile).
wasm-bindgen = { version = "=0.2.130", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
allow_attributes = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

# CLI binary.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Browser module. No `strip` here: wasm-bindgen needs the target_features section; wasm-opt strips later.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
strip = false
