# Behind the Cloudflare tunnel (which terminates TLS): headers, cache rules and compression for the site
# and scan API (the `web` service). Plain HTTP on the internal network only; runs as nonroot on a
# read-only filesystem (temporary files go to the tmpfs at /tmp).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Only cloudflared reaches nginx; the visitor's address comes in CF-Connecting-IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    client_max_body_size 16k;  # The site only takes GET requests.

    # Scans per visitor: one a minute, one at a time. The visitor is the address in CF-Connecting-IP
    # (see set_real_ip_from above); an IPv6 visitor is their /64, which one household or server can
    # rotate through. A request without a valid CF-Connecting-IP keeps cloudflared's address, so all such
    # requests share a single allowance.
    map $remote_addr $scan_visitor {
        "~^(?<net>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" $net;
        default $remote_addr;
    }
    limit_req_zone $scan_visitor zone=scan:10m rate=1r/m;
    limit_conn_zone $scan_visitor zone=scanning:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Docker's DNS, re-resolved: a recreated `web` container may come back on another address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream web {
        zone web 64k;
        server web:8080 resolve;
    }

    server {
        listen 8080;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # A scan can take up to about a minute.
            proxy_read_timeout 90s;
        }

        location = /api/scan {
            limit_req zone=scan;
            limit_conn scanning 1;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # A scan waits in line for up to 30 s, then runs for up to 45 s.
            proxy_read_timeout 90s;
        }

        error_page 429 = @busy;
        location @busy {
            default_type application/json;
            return 429 '{"error":"One scan per minute, please. Try again in a minute."}';
        }

        # SvelteKit fingerprints these files: cache them for a year. (add_header here replaces the
        # server-level headers, so they are repeated.)
        location /_app/immutable/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
}
