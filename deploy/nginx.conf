# Behind the Cloudflare tunnel (which terminates TLS): headers, cache rules and compression for the site
# and scan API (the `web` service). Plain HTTP on the internal network only; runs as nonroot on a
# read-only filesystem (temporary files go to the tmpfs at /tmp).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Only cloudflared reaches nginx; the visitor's address comes in CF-Connecting-IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    client_max_body_size 16k;  # The site only takes GET requests.

    # Docker's DNS, re-resolved: a recreated `web` container may come back on another address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream web {
        zone web 64k;
        server web:8080 resolve;
    }

    server {
        listen 8080;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # A scan can take up to about a minute.
            proxy_read_timeout 90s;
        }

        # The home points agents to what they can use (RFC 8288; isitagentready.com checks it). add_header in
        # a location replaces the server's, so the security headers are repeated.
        location = / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
            add_header Link '</llms.txt>; rel="describedby"; type="text/plain", </index.md>; rel="alternate"; type="text/markdown", </.well-known/api-catalog>; rel="api-catalog", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", <https://github.com/webmcpx/webmcpx#readme>; rel="service-doc"' always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
            add_header X-Frame-Options "DENY" always;
        }

        # RFC 9727's media type for the API catalog (a prerendered file with no extension).
        location = /.well-known/api-catalog {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Content-Type;
            add_header Content-Type "application/linkset+json" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        # The scanner limits each visitor itself (one scan a minute, one at a time), reading the visitor
        # from X-Forwarded-For: always replaced here with the CF-Connecting-IP address, never passed through.
        location = /api/scan {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # A scan waits in line for up to 30 s, then runs for up to 45 s.
            proxy_read_timeout 90s;
        }

        # SvelteKit fingerprints these files: cache them for a year. (add_header here replaces the
        # server-level headers, so they are repeated.)
        location /_app/immutable/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
}
