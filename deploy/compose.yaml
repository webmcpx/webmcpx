# webmcpx in production: three containers, least privilege each.
#
#   visitors ─▶ Cloudflare ◀─outbound tunnel─ cloudflared ──edge──▶ nginx ──▶ web ──scan──▶ chrome
#                                                                             ▲            │
#                                                     egress proxy (public IPs only) ◀─────┘
#
# No port is published: cloudflared dials out to Cloudflare, which terminates TLS. The `scan` network is
# internal (no internet).
#
# Chrome has no route to the network of its own: every request it makes goes through the egress proxy in
# `web`, which resolves hosts itself and refuses private, loopback and reserved addresses (see
# crates/webmcpx-bench/src/proxy.rs). Run: `docker compose -f deploy/compose.yaml --env-file deploy/.env
# up -d --build`, with TUNNEL_TOKEN set (see deploy/README.md).

name: webmcpx

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: { max-size: 10m, max-file: "3" }

services:
  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:2026.10.7
    # A remotely managed tunnel: its public hostname (-> http://nginx:8080) is set in Cloudflare.
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    read_only: true
    networks: [edge]
    depends_on: [nginx]

  nginx:
    <<: *hardening
    build: { context: .., dockerfile: deploy/nginx.Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    networks: [edge]
    depends_on: [web]
    mem_limit: 128m

  web:
    <<: *hardening
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    # 12 scans at once; each visitor (IPv4 address or IPv6 /64, from nginx) one at a time.
    command: [--scan-parallel, "12", --one-scan-per-visitor, --behind-proxy]
    # On a deploy, requests in flight finish, queued scans included: the server stops accepting, then waits
    # up to scan::LONGEST_SCAN (90 s); a test keeps this above it.
    stop_grace_period: 100s
    read_only: true
    networks: [edge, scan]
    depends_on: [chrome]
    mem_limit: 512m
    pids_limit: 256

  chrome:
    <<: *hardening
    # chromedp/headless-shell plus fonts for every site language (see the Dockerfile).
    build: { context: .., dockerfile: deploy/chrome.Dockerfile }
    # The image starts headless-shell with DevTools on 0.0.0.0:9222 and --no-sandbox (the container and
    # its network are the sandbox); these switches lock it to the egress proxy.
    command:
      - --proxy-server=http://web:3128
      - --proxy-bypass-list=<-loopback>
      - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
      - --disable-quic
      - --disable-background-networking
      - --disable-component-update
      - --disable-extensions
      - --no-first-run
    user: "65534:65534"
    environment:
      HOME: /tmp
    read_only: true
    networks: [scan]
    shm_size: 2g
    mem_limit: 8g
    pids_limit: 2048
    tmpfs: [/tmp]

networks:
  edge: {}
  scan:
    internal: true
