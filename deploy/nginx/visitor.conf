# $scan_visitor: whom a scan is counted against. An IPv4 visitor is their address; an IPv6 visitor is
# their /64 (one household or server can rotate through it), whatever form nginx prints the address in:
# it drops leading zeros and compresses a run of zero groups to "::" (2600:1234::1 is 2600:1234:0:0::1).
# Patterns are tried in order. Tested by `just deploy-test`.
map $remote_addr $scan_visitor {
    "~^(?<a>[0-9a-f]+):(?<b>[0-9a-f]+):(?<c>[0-9a-f]+):(?<d>[0-9a-f]+):" "$a:$b:$c:$d::/64";
    "~^(?<a>[0-9a-f]+):(?<b>[0-9a-f]+):(?<c>[0-9a-f]+)::"                 "$a:$b:$c:0::/64";
    "~^(?<a>[0-9a-f]+):(?<b>[0-9a-f]+)::"                                 "$a:$b:0:0::/64";
    "~^(?<a>[0-9a-f]+)::"                                                 "$a:0:0:0::/64";
    "~^::"                                                                "0:0:0:0::/64";
    default $remote_addr;
}
