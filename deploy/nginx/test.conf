# `just deploy-test`: answers with the visitor key nginx derives from X-Test-IP (as it would from
# CF-Connecting-IP), using the production map.
pid /tmp/nginx.pid;
events {}
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Test-IP;
    include /etc/nginx/visitor.conf;
    server {
        listen 8080;
        location / { return 200 "$scan_visitor"; }
    }
}
